<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>takuto@portfolio: ~</title>
  <meta name="description" content="ターミナル風インタラクティブポートフォリオ。help と打つと使い方が出ます。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23060a08'/%3E%3Ctext x='14' y='68' font-family='monospace' font-size='52' fill='%234af26c'%3E%26gt;_%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="green">

  <!-- matrix rain (easter egg) -->
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>

  <!-- CRT overlay -->
  <div class="crt-overlay" aria-hidden="true"></div>

  <main class="window" id="window">
    <header class="titlebar">
      <span class="dots" aria-hidden="true">
        <i class="dot red"></i><i class="dot yellow"></i><i class="dot green"></i>
      </span>
      <span class="title" id="titlebar-title">guest@takuto: ~</span>
      <span class="titlebar-right">bash</span>
    </header>

    <section class="screen" id="screen">
      <div id="output" aria-live="polite"></div>
      <div class="input-line" id="input-line">
        <span class="prompt" id="prompt"></span>
        <span class="cmdline" id="cmdline"><span id="cl-pre"></span><span class="cursor" id="cursor">&nbsp;</span><span id="cl-post"></span></span>
      </div>
    </section>

    <footer class="chips" id="chips" aria-label="クイックコマンド">
      <span class="chips-label">quick:</span>
      <button class="chip" data-cmd="help">help</button>
      <button class="chip" data-cmd="about">about</button>
      <button class="chip" data-cmd="skills">skills</button>
      <button class="chip" data-cmd="projects">projects</button>
      <button class="chip" data-cmd="hobbies">hobbies</button>
      <button class="chip" data-cmd="contact">contact</button>
      <button class="chip" data-cmd="theme">theme</button>
    </footer>
  </main>

  <!-- real (hidden) input: mobile keyboard + IME support -->
  <input id="hidden-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="コマンド入力" />

  <!-- photo lightbox -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-label="写真の拡大表示">
    <img id="lightbox-img" alt="" />
    <div class="lightbox-cap" id="lightbox-cap"></div>
    <div class="lightbox-hint">click / Esc to close</div>
  </div>

  <!-- boot screen -->
  <div class="boot" id="boot">
    <pre id="boot-log"></pre>
    <div class="boot-skip">press any key to skip</div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
